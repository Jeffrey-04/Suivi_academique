openapi: 3.0.3
info:
  title: Suivi Académique API
  version: 1.0.0
  description: |
    API REST PHP de l'application Suivi Académique.

    **Un seul utilisateur : le chef de département.** Les enseignants et les
    étudiants sont des fiches gérées par le chef, sans compte ni connexion.

    Les routes privées utilisent une session PHP transmise par cookie
    `SUIVI_SESSID`. Connectez-vous sur `POST /auth/login` avant d'appeler les
    routes privées (toutes réservées au chef) ; seules `/config` et la connexion
    sont publiques.
  contact:
    name: TYITYI Liano — Backend
    url: https://github.com/Liano-T
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost/Suivi%20Academique/Suivi%20academique%20Backend/api
    description: Laragon local (adapter le chemin si le dossier diffère)
  - url: https://{host}/{backendPath}/api
    description: Serveur déployé
    variables:
      host:
        default: example.com
      backendPath:
        default: backend
tags:
  - name: Configuration
  - name: Authentification
  - name: Référentiels
  - name: Étudiants
  - name: Enseignants
  - name: Matières
  - name: Notes
  - name: Bulletins
  - name: Séances et heures
  - name: Emploi du temps
  - name: Calendrier et notifications
  - name: Compte du chef
  - name: Statistiques
paths:
  /config:
    get:
      tags: [Configuration]
      summary: Configuration publique de l'instance
      description: >
        Aucune connexion requise. Renvoie le mode (`demo` / `production`), la date du jour du serveur (simulée en mode démonstration),
        l'année et le semestre, l'identité de l'établissement, la position du campus et, en mode démonstration seulement,
        les comptes de démonstration. Ne contient aucun secret. Le frontend la charge au démarrage.
      security: []
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
  /auth/login:
    post:
      tags: [Authentification]
      summary: Ouvrir une session
      description: Vérifie l'adresse e-mail et le mot de passe puis pose le cookie de session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: chef@dept-info.demo }
                password: { type: string, format: password, example: demo1234 }
      responses:
        "200":
          description: Connexion réussie ; cookie de session défini.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "429":
          description: Trop d'échecs de connexion pour cette adresse (5 en 15 minutes) ; en-tête `Retry-After` en secondes.
  /auth/logout:
    post:
      tags: [Authentification]
      summary: Fermer la session courante
      responses:
        "204": { description: Session fermée. }
  /auth/me:
    get:
      tags: [Authentification]
      summary: Lire l'utilisateur connecté
      responses:
        "200":
          description: Utilisateur de la session.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /filieres:
    get:
      tags: [Référentiels]
      summary: Lister les filières
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /levels:
    get:
      tags: [Référentiels]
      summary: Lister les niveaux
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /classes:
    get:
      tags: [Référentiels]
      summary: Lister les classes avec leur filière
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /units:
    get:
      tags: [Référentiels]
      summary: Lister les unités d'enseignement
      parameters:
        - { $ref: "#/components/parameters/LevelIdQuery" }
        - { name: semester, in: query, schema: { type: string, enum: [S1, S2] } }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /students/count:
    get:
      tags: [Étudiants]
      summary: Compter les étudiants (chef)
      responses:
        "200":
          description: Nombre total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer, example: 54 }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /students:
    get:
      tags: [Étudiants]
      summary: Lister les étudiants
      parameters:
        - { $ref: "#/components/parameters/FiliereIdQuery" }
        - { $ref: "#/components/parameters/LevelIdQuery" }
        - { name: q, in: query, description: Recherche textuelle insensible à la casse et aux accents., schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Étudiants]
      summary: Créer un étudiant (chef)
      description: Le backend valide les champs et génère le matricule. L'étudiant n'a pas de compte de connexion.
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /students/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Étudiants]
      summary: Lire un étudiant
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Étudiants]
      summary: Modifier un étudiant (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Étudiants]
      summary: Supprimer un étudiant (chef)
      responses:
        "204": { description: Étudiant supprimé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{id}/removal-impact:
    get:
      tags: [Étudiants]
      summary: Vérifier les dépendances avant suppression
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teachers:
    get:
      tags: [Enseignants]
      summary: Lister les enseignants
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Enseignants]
      summary: Créer un enseignant (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /teachers/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Enseignants]
      summary: Lire un enseignant
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Enseignants]
      summary: Modifier un enseignant (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Enseignants]
      summary: Supprimer un enseignant (chef)
      responses:
        "204": { description: Enseignant supprimé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teachers/{id}/usage:
    get:
      tags: [Enseignants]
      summary: Consulter les dépendances d'un enseignant
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subjects:
    get:
      tags: [Matières]
      summary: Lister les matières accessibles
      parameters:
        - { $ref: "#/components/parameters/LevelIdQuery" }
        - { name: semester, in: query, schema: { type: string, enum: [S1, S2] } }
        - { name: teacherId, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Matières]
      summary: Créer une matière (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /subjects/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Matières]
      summary: Lire une matière
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Matières]
      summary: Modifier une matière (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Matières]
      summary: Supprimer une matière (chef)
      responses:
        "204": { description: Matière supprimée. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subjects/{id}/usage:
    get:
      tags: [Matières]
      summary: Consulter les dépendances d'une matière
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subjects/{id}/grade-sheet:
    get:
      tags: [Notes]
      summary: Charger le relevé de notes par matière
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /subjects/{id}/grades/{type}:
    put:
      tags: [Notes]
      summary: Enregistrer les notes en brouillon
      description: Le type de note est CC, EXAMEN ou RATTRAPAGE. Voir le contrôleur pour le schéma détaillé des lignes.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [CC, EXAMEN, RATTRAPAGE] }
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /subjects/{id}/grades/{type}/validate:
    post:
      tags: [Notes]
      summary: Valider les notes saisies
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: type
          in: path
          required: true
          schema: { type: string, enum: [CC, EXAMEN, RATTRAPAGE] }
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /grades:
    get:
      tags: [Notes]
      summary: Lister les notes accessibles
      parameters:
        - { name: studentId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [brouillon, validee] } }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /grades/counts:
    get:
      tags: [Notes]
      summary: Compter les notes par statut (chef)
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /students/{id}/grades/history:
    get:
      tags: [Notes]
      summary: Historique des notes d'un étudiant
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /bulletins:
    get:
      tags: [Bulletins]
      summary: Lister les bulletins accessibles
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /bulletins/generate:
    post:
      tags: [Bulletins]
      summary: Générer ou actualiser des bulletins (chef)
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bulletins/count:
    get:
      tags: [Bulletins]
      summary: Compter les bulletins (chef)
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /bulletins/overview:
    get:
      tags: [Bulletins]
      summary: Synthèse des bulletins (chef)
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /students/{id}/report:
    get:
      tags: [Bulletins]
      summary: Construire le relevé de notes d'un étudiant
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{id}/bulletin:
    get:
      tags: [Bulletins]
      summary: Lire le bulletin d'un étudiant
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /students/{id}/bulletin/document:
    get:
      tags: [Bulletins]
      summary: Télécharger le document du bulletin
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Document du bulletin généré par le backend.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /sessions:
    get:
      tags: [Séances et heures]
      summary: Lister les séances accessibles
      parameters:
        - { name: teacherId, in: query, schema: { type: string } }
        - { $ref: "#/components/parameters/SubjectIdQuery" }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Séances et heures]
      summary: Déclarer une séance
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sessions/detailed:
    get:
      tags: [Séances et heures]
      summary: Lister les séances avec leurs détails
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/stats:
    get:
      tags: [Séances et heures]
      summary: Statistiques des séances
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /sessions/absences:
    post:
      tags: [Séances et heures]
      summary: Enregistrer une absence
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /sessions/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Séances et heures]
      summary: Lire une séance
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Séances et heures]
      summary: Modifier une séance
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Séances et heures]
      summary: Supprimer une séance
      responses:
        "204": { description: Séance supprimée. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /teachers/{id}/hours:
    get:
      tags: [Séances et heures]
      summary: Consulter le volume horaire d'un enseignant
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /hours:
    get:
      tags: [Séances et heures]
      summary: Synthèse des heures du département (chef)
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /timetable/slots:
    get:
      tags: [Emploi du temps]
      summary: Lister les créneaux hebdomadaires
      description: Chaque créneau est rattaché à une matière, qui fixe l'enseignant, la classe et le semestre.
      parameters:
        - { name: teacherId, in: query, schema: { type: string } }
        - { name: levelId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
      responses:
        "200":
          description: Créneaux triés par jour puis heure.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/TimetableSlot" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Emploi du temps]
      summary: Créer un créneau
      description: >
        Champs : `subjectId`, `weekday` (1 = lundi … 6 = samedi), `startTime`, `endTime` (HH:MM, 30 min à 8 h), `room` (facultatif),
        `validFrom`, `validUntil` (dans l'année universitaire). Refusé (422) si l'enseignant, la classe ou la salle ont déjà un créneau
        qui se chevauche le même jour sur la période commune ; le message est porté par le champ `startTime` ou `room`.
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201":
          description: Créneau créé.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlot" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/slots/{id}:
    get:
      tags: [Emploi du temps]
      summary: Lire un créneau
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Le créneau.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Emploi du temps]
      summary: Modifier un créneau
      parameters:
        - { $ref: "#/components/parameters/Id" }
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200":
          description: Créneau modifié.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TimetableSlot" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [Emploi du temps]
      summary: Supprimer un créneau
      description: Ses annulations sont supprimées avec lui ; les séances déjà enregistrées sont conservées.
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "204": { description: Créneau supprimé. }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/occurrences:
    get:
      tags: [Emploi du temps]
      summary: Occurrences datées des créneaux, avec leur statut
      description: >
        Statut : `done` / `absent` (une séance de la même matière, le même jour, sur une plage qui chevauche le créneau),
        `cancelled` (annulée, sauf séance enregistrée), `upcoming` (date postérieure à aujourd'hui), `toConfirm` (date passée ou du jour,
        rien d'enregistré). Sans `from` ni `to` : la semaine en cours. Période de 370 jours au plus.
      parameters:
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: teacherId, in: query, schema: { type: string } }
        - { name: levelId, in: query, schema: { type: string } }
        - { name: subjectId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [upcoming, toConfirm, done, absent, cancelled] } }
      responses:
        "200":
          description: Occurrences triées par date puis heure.
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Occurrence" } }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/occurrences/confirm:
    post:
      tags: [Emploi du temps]
      summary: Confirmer qu'une séance prévue a eu lieu
      description: >
        Corps : `slotId`, `date`, `note` (facultatif). Crée la séance « présent » avec les horaires du créneau, avec les mêmes contrôles que
        `POST /sessions` (pas de séance dans le futur, pas de chevauchement…). Renvoie la séance créée.
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/occurrences/absence:
    post:
      tags: [Emploi du temps]
      summary: Déclarer l'absence de l'enseignant à une séance prévue
      description: "Corps : `slotId`, `date`, `note` (motif, facultatif). Crée la séance « absent ». Renvoie la séance créée."
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/occurrences/cancel:
    post:
      tags: [Emploi du temps]
      summary: Annuler une occurrence (jour férié, salle indisponible…)
      description: "Corps : `slotId`, `date`, `reason` (facultatif, 120 caractères). Aucune séance ni absence n'est comptée. Refusé si une séance est déjà enregistrée."
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /timetable/occurrences/restore:
    post:
      tags: [Emploi du temps]
      summary: Rétablir une occurrence annulée
      description: "Corps : `slotId`, `date`."
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "204": { description: Occurrence rétablie. }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events:
    get:
      tags: [Calendrier et notifications]
      summary: Lister les événements accessibles
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Calendrier et notifications]
      summary: Créer un événement
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "201": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /events/rattrapage-open:
    get:
      tags: [Calendrier et notifications]
      summary: Vérifier si la période de rattrapage est ouverte
      responses:
        "200":
          description: État de la période.
          content:
            application/json:
              schema:
                type: object
                properties:
                  open: { type: boolean, example: false }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /events/{id}:
    parameters:
      - { $ref: "#/components/parameters/Id" }
    get:
      tags: [Calendrier et notifications]
      summary: Lire un événement
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [Calendrier et notifications]
      summary: Modifier un événement
      requestBody: { $ref: "#/components/requestBodies/JsonObject" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Calendrier et notifications]
      summary: Supprimer un événement
      responses:
        "204": { description: Événement supprimé. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /events/{id}/notification-count:
    get:
      tags: [Calendrier et notifications]
      summary: Compter les notifications liées à un événement
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /notifications:
    get:
      tags: [Calendrier et notifications]
      summary: Lister les notifications de l'utilisateur connecté
      responses:
        "200": { $ref: "#/components/responses/JsonArray" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/unread-count:
    get:
      tags: [Calendrier et notifications]
      summary: Compter les notifications non lues
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/read-all:
    post:
      tags: [Calendrier et notifications]
      summary: Marquer toutes les notifications comme lues
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /notifications/{id}/read:
    post:
      tags: [Calendrier et notifications]
      summary: Marquer une notification comme lue
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /me/profile:
    get:
      tags: [Compte du chef]
      summary: Lire le profil et les réglages de l'utilisateur
      responses:
        "200": { $ref: "#/components/responses/JsonObject" }
