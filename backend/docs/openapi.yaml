components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SUIVI_SESSID
      description: Cookie créé par POST /auth/login ; utiliser le cookie jar du client HTTP.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: stu-018
    FiliereIdQuery:
      name: filiereId
      in: query
      schema: { type: string }
    LevelIdQuery:
      name: levelId
      in: query
      schema: { type: string }
    SubjectIdQuery:
      name: subjectId
      in: query
      schema: { type: string }
  requestBodies:
    JsonObject:
      required: true
      description: Corps JSON ; les champs propres à l'opération sont validés par le contrôleur.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
  responses:
    JsonObject:
      description: Objet JSON de résultat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
    JsonArray:
      description: Tableau JSON de résultats.
      content:
        application/json:
          schema:
            type: array
            items: {}
    Unauthorized:
      description: Session absente, invalide ou expirée.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Rôle ou périmètre d'accès insuffisant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Route ou ressource introuvable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Données invalides ou opération refusée par les règles métier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    User:
      type: object
      required: [id, email, role, active]
      properties:
        id: { type: string, example: usr-chef }
        email: { type: string, format: email }
        role: { type: string, enum: [chef, enseignant, etudiant] }
        profileId: { type: string, nullable: true }
        firstName: { type: string }
        lastName: { type: string }
        photo: { type: string }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        settings: { type: object, nullable: true, additionalProperties: true }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
security:
  - SessionCookie: []
