        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /accounts/{id}/reset-password:
    post:
      tags: [Comptes et profil]
      summary: Réinitialiser le mot de passe d'un compte (chef)
      description: >
        Génère un mot de passe **temporaire aléatoire** (11 caractères), pose `mustChangePassword` et le renvoie **une seule fois**
        (`temporaryPassword`). Il est aussi envoyé par e-mail si le service est configuré (`emailSent`). Jamais pour son propre compte.
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Mot de passe temporaire.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  temporaryPassword: { type: string, example: "kP9xQ2mWnB7" }
                  emailSent: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
