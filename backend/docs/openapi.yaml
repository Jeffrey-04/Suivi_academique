components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: SUIVI_SESSID
      description: Cookie créé par POST /auth/login ; utiliser le cookie jar du client HTTP.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
      example: stu-018
    FiliereIdQuery:
      name: filiereId
      in: query
      schema: { type: string }
    LevelIdQuery:
      name: levelId
      in: query
      schema: { type: string }
    SubjectIdQuery:
      name: subjectId
      in: query
      schema: { type: string }
  requestBodies:
    JsonObject:
      required: true
      description: Corps JSON ; les champs propres à l'opération sont validés par le contrôleur.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
  responses:
    JsonObject:
      description: Objet JSON de résultat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/JsonObject" }
    JsonArray:
      description: Tableau JSON de résultats.
      content:
        application/json:
          schema:
            type: array
            items: {}
    Unauthorized:
      description: Session absente, invalide ou expirée.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Rôle ou périmètre d'accès insuffisant.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Route ou ressource introuvable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Données invalides ou opération refusée par les règles métier.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    User:
      type: object
      required: [id, email, role, active]
      properties:
        id: { type: string, example: usr-chef }
        email: { type: string, format: email }
        role: { type: string, enum: [chef] }
        firstName: { type: string }
        lastName: { type: string }
        photo: { type: string }
        active: { type: boolean }
        mustChangePassword: { type: boolean }
        settings: { type: object, nullable: true, additionalProperties: true }
    TimetableSlot:
      type: object
      properties:
        id: { type: string, example: slt-001 }
        subjectId: { type: string }
        teacherId: { type: string, description: Enseignant de la matière (en lecture seule). }
        levelId: { type: string, description: Classe de la matière (en lecture seule). }
        semester: { type: string, enum: [S1, S2] }
        weekday: { type: integer, minimum: 1, maximum: 6, description: 1 = lundi … 6 = samedi }
        startTime: { type: string, example: "08:00" }
        endTime: { type: string, example: "10:00" }
        room: { type: string, nullable: true }
        validFrom: { type: string, format: date }
        validUntil: { type: string, format: date }
    Occurrence:
      type: object
      properties:
        id: { type: string, example: "slt-001@2027-01-06" }
        slotId: { type: string }
        date: { type: string, format: date }
        weekday: { type: integer }
        startTime: { type: string }
        endTime: { type: string }
        room: { type: string, nullable: true }
        subjectId: { type: string }
        teacherId: { type: string }
        levelId: { type: string }
        status: { type: string, enum: [upcoming, toConfirm, done, absent, cancelled] }
        sessionId: { type: string, nullable: true }
        reason: { type: string, nullable: true, description: Motif de l'annulation. }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        fields:
          type: object
          additionalProperties: { type: string }
security:
  - SessionCookie: []
