<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendrier - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Calendrier</h1>
          <p class="page-subtitle" id="page-subtitle"></p>
        </div>
        <div class="d-flex gap-2 flex-wrap align-items-start">
          <button class="btn-table-action" type="button" id="btn-ics" title="Télécharger les événements pour les importer dans Google Agenda, Outlook ou Apple Calendrier"><i class="bi bi-calendar-plus"></i> <span>Mon agenda (.ics)</span></button>
          <div id="export-menu"></div>
          <button class="btn-custom btn-custom-primary" type="button" id="btn-add"><i class="bi bi-plus-lg"></i> Nouvel événement</button>
        </div>
      </div>

      <div class="card cal-card">
        <div class="cal-toolbar">
          <div class="cal-nav">
            <button class="cal-nav-btn" type="button" id="cal-prev" aria-label="Mois précédent"><i class="bi bi-chevron-left"></i></button>
            <h2 class="cal-title" id="cal-title" aria-live="polite"></h2>
            <button class="cal-nav-btn" type="button" id="cal-next" aria-label="Mois suivant"><i class="bi bi-chevron-right"></i></button>
            <button class="btn-table-action" type="button" id="cal-today">Aujourd'hui</button>
          </div>
          <div class="cal-views" role="group" aria-label="Affichage du calendrier">
            <button class="cal-view-btn" type="button" data-view="month" aria-pressed="true"><i class="bi bi-calendar3"></i> Mois</button>
            <button class="cal-view-btn" type="button" data-view="agenda" aria-pressed="false"><i class="bi bi-list-ul"></i> Agenda</button>
          </div>
        </div>
        <div class="cal-filters" id="cal-filters" role="group" aria-label="Filtrer par type d'événement"></div>
        <div id="calendar-body"></div>
      </div>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../assets/js/pages/enseignant-calendrier.js"></script>
</body>
</html>
