<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes séances - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
  <link rel="stylesheet" href="../../assets/libs/flatpickr/flatpickr.min.css">
  <link rel="stylesheet" href="../../assets/libs/apexcharts/apexcharts.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Mes séances</h1>
          <p class="page-subtitle" id="page-subtitle"></p>
        </div>
        <div class="d-flex gap-2 flex-wrap align-items-start">
          <button class="btn-date-picker" type="button" id="date-picker-trigger" aria-label="Choisir la période">
            <i class="bi bi-calendar4-event"></i>
            <span id="selected-date-range"></span>
            <i class="bi bi-chevron-down ms-1"></i>
          </button>
          <div id="export-menu"></div>
          <a class="btn-custom btn-custom-primary" href="declarer-seance.html"><i class="bi bi-plus-circle"></i> Déclarer une séance</a>
        </div>
      </div>

      <div class="row g-4 mb-4" id="kpis"></div>

      <div class="table-card-custom">
        <div class="table-header-control">
          <div class="table-search-box">
            <i class="bi bi-search table-search-icon"></i>
            <input type="search" class="table-search-input" id="search" placeholder="Matière, motif…" aria-label="Rechercher une séance" autocomplete="off">
          </div>
          <div class="table-filter-group">
            <select class="form-select-custom filter-select" id="filter-status" aria-label="Filtrer par statut">
              <option value="">Tous les statuts</option>
              <option value="present">Effectuées</option>
              <option value="absent">Absences</option>
            </select>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table-custom">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
          </table>
        </div>
        <div id="table-footer"></div>
      </div>
      <p class="stat-hint" id="edit-hint"></p>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/apexcharts/apexcharts.min.js"></script>
  <script src="../../assets/libs/flatpickr/flatpickr.min.js"></script>
  <script type="module" src="../../assets/js/pages/enseignant-seances.js"></script>
</body>
</html>
