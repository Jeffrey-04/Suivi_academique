<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tableau de bord - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/libs/apexcharts/apexcharts.css">
  <link rel="stylesheet" href="../../assets/libs/flatpickr/flatpickr.min.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Tableau de bord</h1>
          <p class="page-subtitle" id="page-subtitle"></p>
        </div>
        <button class="btn-date-picker" type="button" id="date-picker-trigger" aria-label="Choisir la période">
          <i class="bi bi-calendar4-event"></i>
          <span id="selected-date-range"></span>
          <i class="bi bi-chevron-down ms-1"></i>
        </button>
      </div>

      <div class="row g-4 mb-3">
        <div class="col-md-4" id="next-event"></div>
        <div class="col-md-8">
          <div class="row g-4 h-100">
            <div class="col-sm-6" id="card-hours"></div>
            <div class="col-sm-6" id="card-grades"></div>
          </div>
        </div>
      </div>

      <h2 class="section-title">Mes matières</h2>
      <div class="row g-4 mb-3">
        <div class="col-xl-9 col-lg-8">
          <div class="row g-4">
            <div class="col-12">
              <div class="card mb-0">
                <div class="card-header mb-2">
                  <h3 class="card-title">Moyennes par matière</h3>
                  <div class="d-flex gap-3 align-items-center">
                    <div class="chart-legend-item"><span class="legend-dot bg-forest-medium"></span><span class="chart-legend-label">Contrôle continu</span></div>
                    <div class="chart-legend-item"><span class="legend-dot bg-lime-accent"></span><span class="chart-legend-label">Examen</span></div>
                  </div>
                </div>
                <p class="stat-hint mb-3">Notes validées, sur 20.</p>
                <div id="subject-chart"></div>
              </div>
            </div>

            <div class="col-md-7 d-flex flex-column">
              <div class="card h-100 flex-grow-1 mb-0">
                <div class="card-header">
                  <h3 class="card-title">Mes dernières séances</h3>
                  <a href="seances.html" class="btn-table-action">Historique</a>
                </div>
                <p class="stat-hint mb-3">Sur la période choisie.</p>
                <div id="recent-sessions"></div>
              </div>
            </div>

            <div class="col-md-5 d-flex flex-column">
              <div class="card h-100 flex-grow-1 mb-0">
                <div class="card-header">
                  <h3 class="card-title">Validation des notes</h3>
                </div>
                <p class="stat-hint mb-3">Notes validées / notes saisies, par matière.</p>
                <div id="validation-progress"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-xl-3 col-lg-4">
          <div class="right-panel-wrapper d-flex flex-column gap-4 h-100">
            <div class="card flex-grow-1 d-flex flex-column justify-content-between mb-0">
              <div class="card-header mb-1">
                <h3 class="card-title">Notes d'examen</h3>
              </div>
              <div id="exam-donut"></div>
              <div id="exam-legend"></div>
            </div>
            <div id="validation-promo"></div>
          </div>
        </div>
      </div>

      <h2 class="section-title">Calendrier</h2>
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Prochaines échéances</h3>
        </div>
        <div id="upcoming-events"></div>
      </div>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/apexcharts/apexcharts.min.js"></script>
  <script src="../../assets/libs/flatpickr/flatpickr.min.js"></script>
  <script type="module" src="../../assets/js/pages/enseignant-dashboard.js"></script>
</body>
</html>
