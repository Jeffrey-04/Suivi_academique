<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marquer ma présence - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Marquer ma présence</h1>
          <p class="page-subtitle" id="page-subtitle">Confirmez votre arrivée : votre position est comparée à celle du campus.</p>
        </div>
        <a class="btn-custom btn-custom-light" href="declarer-seance.html"><i class="bi bi-plus-circle"></i> Déclarer une séance</a>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Je suis arrivé</h3></div>
            <div id="checkin-host">
              <div class="empty-state" aria-busy="true"><div class="spinner-border spinner-border-sm" role="status"></div><p>Chargement…</p></div>
            </div>
            <div id="checkin-result" aria-live="polite"></div>
          </div>
        </div>
        <div class="col-lg-5">
          <div class="card">
            <div class="card-header"><h3 class="card-title">Le campus</h3></div>
            <div id="campus"></div>
          </div>
          <div class="card">
            <div class="card-header"><h3 class="card-title">Mes dernières présences</h3></div>
            <div id="recent"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../assets/js/pages/enseignant-marquer-presence.js"></script>
</body>
</html>
