<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emploi du temps - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Emploi du temps</h1>
          <p class="page-subtitle" id="page-subtitle">Créneaux hebdomadaires des enseignants et suivi des séances prévues.</p>
        </div>
        <div class="d-flex gap-2 flex-wrap align-items-start">
          <button class="btn-custom btn-custom-primary" type="button" id="btn-add-slot"><i class="bi bi-plus-lg"></i> Nouveau créneau</button>
          <div id="export-menu"></div>
        </div>
      </div>

      <div class="row g-4 mb-4" id="kpis"></div>

      <div class="table-card-custom filter-bar">
        <div class="table-header-control">
          <div class="filter-bar-group">
            <label for="filter-teacher" class="form-label-custom">Enseignant</label>
            <select class="form-select-custom" id="filter-teacher"></select>
          </div>
          <div class="filter-bar-group">
            <label for="filter-class" class="form-label-custom">Classe</label>
            <select class="form-select-custom" id="filter-class"></select>
          </div>
          <div class="filter-bar-group filter-bar-grow">
            <span class="form-label-custom" id="tab-label">Affichage</span>
            <div class="segmented" role="group" aria-labelledby="tab-label" id="tabs"></div>
          </div>
        </div>
      </div>

      <div id="content">
        <div class="empty-state" aria-busy="true"><div class="spinner-border spinner-border-sm" role="status"></div><p>Chargement…</p></div>
      </div>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../../assets/js/pages/chef-emploi-du-temps.js"></script>
</body>
</html>
