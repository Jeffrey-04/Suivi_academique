<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes - Suivi Académique</title>
  <link rel="icon" type="image/png" href="../../assets/images/favicon.ico">
  <link rel="stylesheet" href="../../assets/libs/bootstrap/css/bootstrap.min.css">
  <link rel="stylesheet" href="../../assets/libs/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="../../assets/libs/apexcharts/apexcharts.css">
  <!-- Police : chargée sans bloquer l'affichage (la page reste utilisable hors ligne, la police se substitue) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="../../assets/css/main.css">
</head>

<body class="app-loading">
  <!-- Sidebar, navbar et footer sont injectés par layout.js (initPage) -->
  <div class="main-wrapper">
    <main>
      <div class="page-header">
        <div>
          <h1 class="page-title">Notes</h1>
          <p class="page-subtitle" id="page-subtitle">Consultation par classe et par matière. La saisie et la validation sont réservées aux enseignants.</p>
        </div>
        <div id="export-menu"></div>
      </div>

      <div class="table-card-custom filter-bar">
        <div class="table-header-control">
          <div class="filter-bar-group">
            <label for="select-class" class="form-label-custom">Classe</label>
            <select class="form-select-custom" id="select-class"></select>
          </div>
          <div class="filter-bar-group filter-bar-grow">
            <label for="select-subject" class="form-label-custom">Matière</label>
            <select class="form-select-custom" id="select-subject"></select>
          </div>
          <div class="filter-bar-group">
            <label for="select-status" class="form-label-custom">Afficher</label>
            <select class="form-select-custom" id="select-status">
              <option value="">Tous les étudiants</option>
              <option value="drafts">Avec notes en brouillon</option>
              <option value="missing">Avec notes manquantes</option>
              <option value="below">Sous la moyenne</option>
            </select>
          </div>
        </div>
      </div>

      <div id="content"></div>
    </main>
  </div>

  <script src="../../assets/libs/bootstrap/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/libs/apexcharts/apexcharts.min.js"></script>
  <script type="module" src="../../assets/js/pages/chef-notes.js"></script>
</body>
</html>
